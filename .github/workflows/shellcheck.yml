name: ShellCheck

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships on the ubuntu-latest runner image, so no install or
      # third-party action is needed.
      - name: Run ShellCheck
        run: shellcheck --severity=warning sectools.sh
